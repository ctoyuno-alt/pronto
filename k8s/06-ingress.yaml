apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pronto-ingress
  namespace: pronto
  annotations:
    # Traefik is the default Ingress Controller in k3s
    kubernetes.io/ingress.class: "traefik"
    
    # Optional: Enable Cert-Manager for automatic SSL certificates
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # tls:
  # - hosts:
  #   - pronto.example.com
  #   secretName: pronto-tls-cert
  rules:
    - host: pronto.local # Replace with your domain or local hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pronto-app
                port:
                  number: 3000
