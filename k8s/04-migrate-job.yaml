apiVersion: batch/v1
kind: Job
metadata:
  name: pronto-migrate
  namespace: pronto
  labels:
    app.kubernetes.io/name: pronto-migrate
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pronto-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z pronto-postgres 5432; do echo waiting for postgres; sleep 2; done;"
      containers:
        - name: migrate
          image: 127.0.0.1:30500/pronto-app:v1
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/scripts/migrate.js"]
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pronto-config
                  key: NODE_ENV
            - name: MIGRATE_SSL
              valueFrom:
                configMapKeyRef:
                  name: pronto-config
                  key: MIGRATE_SSL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pronto-secrets
                  key: DATABASE_URL
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: pronto-config
                  key: NEXT_PUBLIC_APP_URL
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: pronto-secrets
                  key: CRON_SECRET
