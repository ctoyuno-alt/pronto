  namespace: pronto
type: Opaque
stringData:
  # NOTE: Replace these values in production or generate using `node scripts/generate-k8s-keys.js`
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "8f169188433ac04d2dc355c9ae7e9c3a"
  POSTGRES_DB: "postgres"
  
  DATABASE_URL: "postgresql://postgres:8f169188433ac04d2dc355c9ae7e9c3a@pronto-postgres:5432/postgres?sslmode=disable"
  GOTRUE_DB_DATABASE_URL: "postgres://postgres:8f169188433ac04d2dc355c9ae7e9c3a@pronto-postgres:5432/postgres?sslmode=disable"
  
  GOTRUE_JWT_SECRET: "pronto_super_secret_jwt_key_32_bytes_long_change_me!"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhYmdj...REPLACE_WITH_GENERATED_ANON_KEY"
  SUPABASE_SERVICE_ROLE_KEY: "eyJhYmdj...REPLACE_WITH_GENERATED_SERVICE_ROLE_KEY"
  
  CRON_SECRET: "pronto_cron_secret_random_32_bytes_key"
  INTERNAL_API_SECRET: "pronto_internal_api_secret_random_32_bytes"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: pronto
data:
  00-init-supabase-db.sql: |
    -- Initialize Supabase Auth extensions, roles, and schemas
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    DO $$
    BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END $$;

    CREATE SCHEMA IF NOT EXISTS auth;
    CREATE SCHEMA IF NOT EXISTS extensions;

    DO $$ BEGIN
        CREATE TYPE auth.factor_type AS ENUM ('totp', 'webauthn', 'phone');
    EXCEPTION WHEN duplicate_object THEN null; END $$;

    DO $$ BEGIN
        CREATE TYPE auth.factor_status AS ENUM ('unverified', 'verified');
    EXCEPTION WHEN duplicate_object THEN null; END $$;

    DO $$ BEGIN
        CREATE TYPE auth.aal_level AS ENUM ('aal1', 'aal2', 'aal3');
    EXCEPTION WHEN duplicate_object THEN null; END $$;

    DO $$ BEGIN
        CREATE TYPE auth.code_challenge_method AS ENUM ('s256', 'plain');
    EXCEPTION WHEN duplicate_object THEN null; END $$;

    GRANT USAGE ON SCHEMA auth TO postgres, anon, authenticated, service_role;
    GRANT ALL ON ALL TABLES IN SCHEMA auth TO postgres, anon, authenticated, service_role;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA auth TO postgres, anon, authenticated, service_role;
    GRANT ALL ON ALL ROUTINES IN SCHEMA auth TO postgres, anon, authenticated, service_role;
