apiVersion: v1
kind: ConfigMap
metadata:
  name: pronto-config
  namespace: pronto
data:
  NEXT_PUBLIC_DEPLOYMENT_MODE: "selfhosted"
  NODE_ENV: "production"
  MIGRATE_SSL: "false"
  NEXT_PUBLIC_APP_URL: "http://pronto.local"
  NEXT_PUBLIC_SITE_URL: "http://pronto.local"
  NEXT_PUBLIC_SUPABASE_URL: "http://pronto.local"
  
  # GoTrue Auth Configuration
  GOTRUE_API_HOST: "0.0.0.0"
  GOTRUE_API_PORT: "9999"
  GOTRUE_API_PREFIX: "/auth/v1"
  GOTRUE_API_EXTERNAL_URL: "http://pronto.local"
  API_EXTERNAL_URL: "http://pronto.local"
  GOTRUE_DB_DRIVER: "postgres"
  GOTRUE_SITE_URL: "http://pronto.local"
  GOTRUE_URI_ALLOW_LIST: "*"
  GOTRUE_DISABLE_SIGNUP: "false"
  GOTRUE_JWT_EXP: "3600"
  GOTRUE_JWT_ALGO: "HS256"
  GOTRUE_LOG_LEVEL: "info"
  GOTRUE_MAILER_AUTOCONFIRM: "true"

---
